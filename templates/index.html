<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة كربلاء التفاعلية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: bold;
            color: #555;
        }
        select, input[type="number"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .map-container {
            margin-top: 30px;
            width: 100%;
            max-width: 1000px;
            height: 600px;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .error {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>خريطة كربلاء التفاعلية</h1>

    <form method="POST" action="/">
        <label for="start">نقطة البداية (Start):</label>
        <select name="start" id="start" required>
            <option value="" disabled selected>اختر نقطة البداية...</option>
            {% for p in places %}
                <option value="{{ p }}" {% if start == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>

        <label for="stop">نقطة النهاية (Stop):</label>
        <select name="stop" id="stop" required>
            <option value="" disabled selected>اختر نقطة النهاية...</option>
            {% for p in places %}
                <option value="{{ p }}" {% if stop == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>

        <label for="algorithm">الخوارزمية (Algorithm):</label>
        <select name="algorithm" id="algorithm" required>
            <option value="" disabled selected>اختر الخوارزمية...</option>
            {% for a in algorithms %}
                <option value="{{ a }}" {% if algorithm == a %}selected{% endif %}>{{ a }}</option>
            {% endfor %}
        </select>

        <label for="speed">السرعة كم/ساعة (Speed km/h):</label>
        <input type="number" name="speed" id="speed" value="{{ speed if speed else 50 }}" min="1" required>

        <label for="limit">الحد (Limit - لـ DLS فقط):</label>
        <input type="number" name="limit" id="limit" value="0" min="0">

        <label for="max_depth">العمق الأقصى (Max Depth - لـ IDDFS فقط):</label>
        <input type="number" name="max_depth" id="max_depth" value="0" min="0">

        <button type="submit">ارسم الخريطة (Draw Map)</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if map_html %}
        <div class="map-container">
            <iframe srcdoc="{{ map_html | escape }}" width="100%" height="100%" frameborder="0"></iframe>
        </div>
    {% endif %}

</body>
</html>
